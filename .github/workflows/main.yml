name: CD Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_NAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          command_timeout: 600
          script: |
            cd /home/${{ secrets.HOST_NAME }}/portfolio
            git config --global --add safe.directory /home/${{ secrets.HOST_NAME }}/portfolio
            git checkout main
            git pull
            npm install
            npm run build
            pm2 restart portfolio
