name: CD Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_NAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          command_timeout: 600s
          script: |
            cd /home/barous/portfolio
            git config --global --add safe.directory /home/barous/portfolio
            git checkout main
            pm2 stop portfolio
            git pull
            npm ci
            npm run build
            pm2 restart portfolio

