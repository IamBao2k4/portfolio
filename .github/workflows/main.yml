name: CD Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_NAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            sudo su ${{ secrets.USERNAME }}
            cd /home/${{ secrets.USERNAME }}/portfolio
            git checkout main
            git pull
            npm install
            npm run build
            pm2 restart 0
